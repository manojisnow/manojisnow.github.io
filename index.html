<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find Manoj Kumar's website, writing, and open-source projects.">
  <title>Manoj Kumar</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: #f4f6f9;
      color: #17243a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: 100%; max-width: 520px; }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.25rem, 8vw, 3.5rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }
    p { margin: 0; color: #4b586c; font-size: 1.125rem; line-height: 1.7; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 22px;
      border: 1px solid #1f3864;
      border-radius: 6px;
      color: #1f3864;
      font-weight: 600;
      text-decoration: none;
    }
    a:first-child { background: #1f3864; color: #fff; }
    a:hover { text-decoration: underline; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #3467bc; outline-offset: 4px; }
    @media (max-width: 360px) { nav { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <h1>Manoj Kumar</h1>
    <p>Find my work and writing on my website, or explore my projects on GitHub.</p>
    <nav aria-label="Find me online">
      <a href="https://manojkumar.eu/">Website</a>
      <a href="https://github.com/manojisnow">GitHub</a>
    </nav>
  </main>
</body>
</html>
